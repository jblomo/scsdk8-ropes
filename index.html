<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Tag Arena</title>
  <style>
    :root {
      --bg-1: #040612;
      --bg-2: #0a1531;
      --accent-1: #34d6ff;
      --accent-2: #ff4fd8;
      --good: #7fff8d;
      --danger: #ff6b6b;
      --text: #ecf4ff;
      --muted: #9ab0c6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, #1b2f68 0%, transparent 30%),
        radial-gradient(circle at 80% 10%, #5f1455 0%, transparent 28%),
        radial-gradient(circle at 50% 85%, #123d48 0%, transparent 35%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .game-shell {
      width: min(96vw, 1220px);
      position: relative;
      padding-top: 16px;
    }

    .hud {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .player-card {
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(8, 14, 34, 0.72);
      backdrop-filter: blur(4px);
      padding: 10px 14px;
      box-shadow: 0 0 14px rgba(0, 0, 0, 0.35);
    }

    .player-card h2 {
      margin: 0;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .player-card p {
      margin: 6px 0 0;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .center-card {
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      color: var(--muted);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.2);
    }

    .pulse {
      color: var(--good);
      font-weight: 700;
    }

    canvas {
      width: 100%;
      height: auto;
      aspect-ratio: 16/9;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow:
        0 0 24px rgba(52, 214, 255, 0.24),
        0 0 44px rgba(255, 79, 216, 0.2);
      background: rgba(6, 11, 28, 0.88);
      display: block;
    }

    .help {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .help b {
      color: var(--text);
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <section class="hud">
      <article class="player-card" id="p1Card"></article>
      <article class="center-card" id="statusText">Loading arena...</article>
      <article class="player-card" id="p2Card"></article>
    </section>

    <canvas id="arena" width="1280" height="720"></canvas>

    <section class="help">
      <div><b>Player 1:</b> Arrow keys to move, <b>Q</b> to use Pulse</div>
      <div><b>Player 2:</b> WASD to move, <b>E</b> to use Pulse</div>
      <div><b>New mechanic:</b> Grab the glowing orb to charge your pulse ability.</div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById("arena");
    const ctx = canvas.getContext("2d");
    const p1Card = document.getElementById("p1Card");
    const p2Card = document.getElementById("p2Card");
    const statusText = document.getElementById("statusText");

    const WORLD = {
      width: canvas.width,
      height: canvas.height,
      friction: 0.86,
      maxSpeed: 350,
      playerSize: 40,
      tagDistance: 48,
      orbRadius: 14,
    };

    const keys = new Set();
    const particles = [];

    class Player {
      constructor(name, color, x, y, controls) {
        this.name = name;
        this.color = color;
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.score = 0;
        this.isIt = false;
        this.pulseCharge = 0;
        this.controls = controls;
        this.pulseCooldown = 0;
        this.hitFlash = 0;
      }

      update(dt) {
        const accel = 900;

        if (keys.has(this.controls.left)) this.vx -= accel * dt;
        if (keys.has(this.controls.right)) this.vx += accel * dt;
        if (keys.has(this.controls.up)) this.vy -= accel * dt;
        if (keys.has(this.controls.down)) this.vy += accel * dt;

        this.vx *= WORLD.friction;
        this.vy *= WORLD.friction;

        const speed = Math.hypot(this.vx, this.vy);
        if (speed > WORLD.maxSpeed) {
          const ratio = WORLD.maxSpeed / speed;
          this.vx *= ratio;
          this.vy *= ratio;
        }

        this.x += this.vx * dt;
        this.y += this.vy * dt;

        // Bounce off walls with a little energy loss.
        const half = WORLD.playerSize / 2;
        if (this.x < half) {
          this.x = half;
          this.vx *= -0.7;
        }
        if (this.x > WORLD.width - half) {
          this.x = WORLD.width - half;
          this.vx *= -0.7;
        }
        if (this.y < half) {
          this.y = half;
          this.vy *= -0.7;
        }
        if (this.y > WORLD.height - half) {
          this.y = WORLD.height - half;
          this.vy *= -0.7;
        }

        this.pulseCooldown = Math.max(0, this.pulseCooldown - dt);
        this.hitFlash = Math.max(0, this.hitFlash - dt);
      }

      draw() {
        const size = WORLD.playerSize;
        const glow = this.isIt ? 20 : 10;

        ctx.save();
        ctx.translate(this.x, this.y);

        ctx.shadowColor = this.color;
        ctx.shadowBlur = glow + (this.hitFlash > 0 ? 12 : 0);
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.isIt ? 1 : 0.9;
        ctx.fillRect(-size / 2, -size / 2, size, size);

        // Inner marker: whoever has the dot is "IT".
        if (this.isIt) {
          ctx.shadowBlur = 0;
          ctx.fillStyle = "#2c0f00";
          ctx.beginPath();
          ctx.arc(0, 0, 6, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      tryPulse(opponent) {
        if (this.pulseCharge < 1 || this.pulseCooldown > 0) return false;

        this.pulseCharge = 0;
        this.pulseCooldown = 4;

        const dx = opponent.x - this.x;
        const dy = opponent.y - this.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const range = 240;

        spawnRing(this.x, this.y, this.color);

        if (distance <= range) {
          const force = 900;
          opponent.vx += (dx / distance) * force;
          opponent.vy += (dy / distance) * force;
          opponent.hitFlash = 0.25;
        }

        return true;
      }
    }

    const player1 = new Player("Player 1", "#34d6ff", 100, 120, {
      up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight", pulse: "q",
    });

    const player2 = new Player("Player 2", "#ff4fd8", WORLD.width - 100, WORLD.height - 120, {
      up: "w", down: "s", left: "a", right: "d", pulse: "e",
    });

    player1.isIt = true;

    let orb = randomOrb();

    function randomOrb() {
      const padding = 80;
      return {
        x: padding + Math.random() * (WORLD.width - padding * 2),
        y: padding + Math.random() * (WORLD.height - padding * 2),
      };
    }

    function drawArenaBackground(time) {
      ctx.clearRect(0, 0, WORLD.width, WORLD.height);

      const gradient = ctx.createLinearGradient(0, 0, WORLD.width, WORLD.height);
      gradient.addColorStop(0, "rgba(15, 26, 58, 0.95)");
      gradient.addColorStop(1, "rgba(12, 36, 34, 0.95)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, WORLD.width, WORLD.height);

      // Animated grid for "mind-blowing" neon style.
      const spacing = 40;
      ctx.save();
      ctx.strokeStyle = "rgba(150, 200, 255, 0.09)";
      ctx.lineWidth = 1;
      ctx.beginPath();

      for (let x = 0; x <= WORLD.width; x += spacing) {
        const wave = Math.sin(time * 0.001 + x * 0.01) * 8;
        ctx.moveTo(x, 0);
        ctx.lineTo(x + wave, WORLD.height);
      }

      for (let y = 0; y <= WORLD.height; y += spacing) {
        const wave = Math.cos(time * 0.0012 + y * 0.009) * 8;
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.width, y + wave);
      }

      ctx.stroke();
      ctx.restore();

      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, WORLD.width - 4, WORLD.height - 4);
    }

    function drawOrb(time) {
      const pulse = 1 + Math.sin(time * 0.006) * 0.18;
      const radius = WORLD.orbRadius * pulse;

      ctx.save();
      ctx.translate(orb.x, orb.y);
      ctx.shadowColor = "#7fff8d";
      ctx.shadowBlur = 22;
      ctx.fillStyle = "#7fff8d";
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(255,255,255,0.8)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, radius + 5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function spawnRing(x, y, color) {
      for (let i = 0; i < 28; i++) {
        const angle = (Math.PI * 2 * i) / 28;
        const speed = 240 + Math.random() * 160;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.55,
          color,
        });
      }
    }

    function spawnTagBurst(x, y) {
      for (let i = 0; i < 32; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 100 + Math.random() * 280;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 0.45,
          color: "#ffd86b",
        });
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.95;
        p.vy *= 0.95;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life * 1.8);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2.7, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function checkOrbPickup(player) {
      const dist = Math.hypot(player.x - orb.x, player.y - orb.y);
      if (dist < WORLD.playerSize / 2 + WORLD.orbRadius + 3) {
        player.pulseCharge = 1;
        orb = randomOrb();
      }
    }

    function checkTag() {
      const dx = player1.x - player2.x;
      const dy = player1.y - player2.y;
      const dist = Math.hypot(dx, dy);

      if (dist <= WORLD.tagDistance) {
        if (player1.isIt) {
          player2.score += 1;
        } else {
          player1.score += 1;
        }

        player1.isIt = !player1.isIt;
        player2.isIt = !player2.isIt;
        spawnTagBurst((player1.x + player2.x) / 2, (player1.y + player2.y) / 2);

        // Separate players a little to avoid instant retrigger.
        const push = 18;
        const nx = dx / Math.max(1, dist);
        const ny = dy / Math.max(1, dist);
        player1.x += nx * push;
        player1.y += ny * push;
        player2.x -= nx * push;
        player2.y -= ny * push;
      }
    }

    function updateHud() {
      const itText1 = player1.isIt ? "IT" : "Runner";
      const itText2 = player2.isIt ? "IT" : "Runner";

      p1Card.innerHTML = `
        <h2>${player1.name}</h2>
        <p>Score: ${player1.score} • ${itText1}</p>
        <p class="pulse">Pulse: ${player1.pulseCharge ? "Ready" : "Not ready"}</p>
      `;

      p2Card.innerHTML = `
        <h2>${player2.name}</h2>
        <p>Score: ${player2.score} • ${itText2}</p>
        <p class="pulse">Pulse: ${player2.pulseCharge ? "Ready" : "Not ready"}</p>
      `;

      const currentIt = player1.isIt ? player1.name : player2.name;
      statusText.textContent = `${currentIt} is IT • First to 10 tags wins`;

      if (player1.score >= 10 || player2.score >= 10) {
        const winner = player1.score > player2.score ? player1.name : player2.name;
        statusText.textContent = `🏆 ${winner} wins! Refresh to play again.`;
      }
    }

    function drawMotionTrail(player) {
      ctx.save();
      const speed = Math.hypot(player.vx, player.vy);
      if (speed < 35) {
        ctx.restore();
        return;
      }

      const trailLength = Math.min(60, speed * 0.14);
      const nx = player.vx / speed;
      const ny = player.vy / speed;

      const gradient = ctx.createLinearGradient(
        player.x,
        player.y,
        player.x - nx * trailLength,
        player.y - ny * trailLength
      );
      gradient.addColorStop(0, player.color + "aa");
      gradient.addColorStop(1, player.color + "00");

      ctx.strokeStyle = gradient;
      ctx.lineWidth = 10;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x - nx * trailLength, player.y - ny * trailLength);
      ctx.stroke();

      ctx.restore();
    }

    let last = performance.now();

    function frame(now) {
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;

      if (player1.score < 10 && player2.score < 10) {
        player1.update(dt);
        player2.update(dt);
        checkOrbPickup(player1);
        checkOrbPickup(player2);
        checkTag();
      }

      updateParticles(dt);

      drawArenaBackground(now);
      drawOrb(now);
      drawMotionTrail(player1);
      drawMotionTrail(player2);
      player1.draw();
      player2.draw();
      drawParticles();
      updateHud();

      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.add(key);

      if (key === player1.controls.pulse) {
        player1.tryPulse(player2);
      }
      if (key === player2.controls.pulse) {
        player2.tryPulse(player1);
      }
    });

    window.addEventListener("keyup", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    requestAnimationFrame(frame);
  </script>
</body>
</html>
